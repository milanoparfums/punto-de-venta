function doPost(e){
  try{
    const data = JSON.parse(e.postData.contents);
    const ss = SpreadsheetApp.getActiveSpreadsheet();
    
    // Crear hojas si no existen
    const sheets = {
      Ventas: ['ID','Fecha','Hora','Cliente','Barbero','Metodo','Subtotal','Descuento','Total','Items'],
      Clientes: ['ID','Nombre','Telefono','Email','Sellos','Visitas','TotalGastado','Nivel','FavPerfume'],
      ProductosRetail: ['ID','Nombre','Categoria','Marca','Precio','Stock','Activo'],
      Perfumes: ['Codigo','Nombre','Marca','Familia','Genero','StockEssence','Activo'],
      Servicios: ['ID','Nombre','Duracion','Precio','Comision','Icon'],
      Barberos: ['ID','Nombre','Servicios','Ingresos'],
      Inventario: ['Tipo','Key','Valor','Fecha'],
      Caja: ['Fecha','Ingresos','Egresos','Saldo','VentasCount']
    };
    
    Object.keys(sheets).forEach(name=>{
      let sh = ss.getSheetByName(name);
      if(!sh){ sh = ss.insertSheet(name); sh.appendRow(sheets[name]); }
    });
    
    // Limpiar y escribir datos
    if(data.ventas){
      const sh = ss.getSheetByName('Ventas');
      sh.clear(); sh.appendRow(sheets.Ventas);
      data.ventas.forEach(v=>{
        sh.appendRow([v.id, v.fecha, v.hora, v.clienteNombre, v.barberoNombre, v.metodo, v.subtotal, v.descuento, v.total, v.items.map(i=>i.nombre+' x'+i.qty).join(', ')]);
      });
    }
    if(data.clientes){
      const sh = ss.getSheetByName('Clientes');
      sh.clear(); sh.appendRow(sheets.Clientes);
      data.clientes.forEach(c=>{ sh.appendRow([c.id,c.nombre,c.telefono,c.email||'',c.sellos,c.visitas,c.totalGastado,c.nivel,c.favPerfume||'']); });
    }
    if(data.retailProducts){
      const sh = ss.getSheetByName('ProductosRetail');
      sh.clear(); sh.appendRow(sheets.ProductosRetail);
      data.retailProducts.forEach(r=>{ sh.appendRow([r.id,r.nombre,r.categoria,r.marca||'',r.precio,r.stock,r.activo!==false?'SI':'NO']); });
    }
    if(data.perfumes){
      const sh = ss.getSheetByName('Perfumes');
      sh.clear(); sh.appendRow(sheets.Perfumes);
      data.perfumes.forEach(p=>{ sh.appendRow([p.codigo,p.nombre,p.marca,p.familia,p.genero,p.stockEssence,p.activo!==false?'SI':'NO']); });
    }
    if(data.servicios){
      const sh = ss.getSheetByName('Servicios');
      sh.clear(); sh.appendRow(sheets.Servicios);
      data.servicios.forEach(s=>{ sh.appendRow([s.id,s.nombre,s.duracion,s.precio,s.comision||'',s.icon]); });
    }
    if(data.barberos){
      const sh = ss.getSheetByName('Barberos');
      sh.clear(); sh.appendRow(sheets.Barberos);
      data.barberos.forEach(b=>{ sh.appendRow([b.id,b.nombre,b.servicios,b.ingresos]); });
    }
    if(data.inventario){
      const sh = ss.getSheetByName('Inventario');
      sh.clear(); sh.appendRow(sheets.Inventario);
      Object.entries(data.inventario.envases||{}).forEach(([k,v])=>{ sh.appendRow(['Envase',k,v,new Date()]); });
      sh.appendRow(['Alcohol','total',data.inventario.alcohol,new Date()]);
    }
    if(data.caja){
      const sh = ss.getSheetByName('Caja');
      sh.clear(); sh.appendRow(sheets.Caja);
      sh.appendRow([new Date(), data.caja.ingresos, data.caja.egresos, data.caja.saldo, (data.ventas||[]).length]);
    }
    
    return ContentService.createTextOutput(JSON.stringify({ok:true, timestamp:new Date()})).setMimeType(ContentService.MimeType.JSON);
  }catch(err){
    return ContentService.createTextOutput(JSON.stringify({ok:false, error: err.toString()})).setMimeType(ContentService.MimeType.JSON);
  }
}
